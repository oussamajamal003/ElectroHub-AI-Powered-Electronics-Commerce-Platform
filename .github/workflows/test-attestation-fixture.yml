name: Test Non-Production Attestation Fixture

on:
  push:
    branches:
      - test/attestation-fixture
  workflow_dispatch:
    inputs:
      reason:
        description: 'Authorization reason for non-production fixture test'
        required: false
        default: 'Task 06.3Q-R Owner-Authorized Non-Production Attestation Fixture'

permissions: {}

jobs:
  test-attestation:
    name: Non-Production Attestation Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create disposable non-production payload
        id: create-payload
        run: |
          set -euo pipefail
          PAYLOAD_FILE="disposable-payload.txt"
          cat <<EOF > "$PAYLOAD_FILE"
          ElectroHub Non-Production Attestation Fixture
          Run ID: ${{ github.run_id }}
          Run Attempt: ${{ github.run_attempt }}
          Commit SHA: ${{ github.sha }}
          Ref: ${{ github.ref }}
          Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Notice: Strictly disposable non-production payload for cryptographic verification.
          EOF

          SHA256=$(sha256sum "$PAYLOAD_FILE" | awk '{print $1}')
          echo "payload-path=$PAYLOAD_FILE" >> "$GITHUB_OUTPUT"
          echo "payload-sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Created disposable payload ($PAYLOAD_FILE) with SHA256: $SHA256"
          cat "$PAYLOAD_FILE"

      - name: Generate artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.create-payload.outputs.payload-path }}
          show-summary: true

      - name: Execute attestation verification suite
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.create-payload.outputs.payload-path }}
          EXPECTED_SHA256: ${{ steps.create-payload.outputs.payload-sha256 }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          REPO: ${{ github.repository }}
          EXPECTED_WORKFLOW: .github/workflows/test-attestation-fixture.yml
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          echo "================================================================"
          echo " 0. VERIFIER SUPPLY-CHAIN & RUNTIME CONTEXT"
          echo "================================================================"
          echo "gh CLI version:"
          GH_VERSION_OUTPUT=$(gh --version | head -n 1)
          echo "$GH_VERSION_OUTPUT"
          REQUIRED_GH_VERSION="2.104.0"
          if [ "$GH_VERSION_OUTPUT" != "gh version ${REQUIRED_GH_VERSION} (2026-11-12)" ]; then
            echo "CRITICAL DEFECT: unsupported or unvalidated gh attestation verifier version: $GH_VERSION_OUTPUT"
            exit 1
          fi
          echo "OpenSSL version:"
          openssl version
          echo "jq version:"
          jq --version
          echo "Repository: $REPO"
          echo "Workflow: $EXPECTED_WORKFLOW"
          echo "Commit SHA: $EXPECTED_COMMIT"
          echo "Ref: $EXPECTED_REF"
          echo "Payload: $PAYLOAD"
          echo "Expected SHA256: $EXPECTED_SHA256"
          echo "Bundle Path: $BUNDLE"
          echo "Attestation ID: $ATTESTATION_ID"
          echo "Attestation URL: $ATTESTATION_URL"

          # Helper function for verifying expected security policy rejections
          verify_expected_failure() {
            local test_name="$1"
            local log_file="$2"
            local exit_status="$3"
            local expected_pattern="$4"

            echo "--> Evaluating outcome for: $test_name"
            echo "Observed exit status: $exit_status"
            echo "--- Verifier output start ---"
            cat "$log_file"
            echo "--- Verifier output end ---"

            # 1. Verification command must have returned non-zero
            if [ "$exit_status" -eq 0 ]; then
              echo "CRITICAL DEFECT: [$test_name] command unexpectedly SUCCEEDED when security rejection was required!"
              exit 1
            fi

            # 2. Check for unexpected CLI, auth, or infrastructure failures (which must fail the test)
            if grep -i -E "(unknown flag|unknown command|unknown shorthand flag|bad credentials|could not resolve to a user|rate limit|connection refused|command not found|could not read|permission denied|fatal:|panic:|segmentation fault|Error: failed to connect)" "$log_file"; then
              echo "CRITICAL DEFECT: [$test_name] failed due to CLI syntax, authentication, or infrastructure error rather than security verification policy rejection!"
              exit 1
            fi

            # 3. Check for specific verification policy failure message (disallowing generic terms like policy, signer, verification failed)
            if ! grep -i -E "$expected_pattern" "$log_file"; then
              echo "CRITICAL DEFECT: [$test_name] failure output did not match specific expected rejection pattern ('$expected_pattern')!"
              exit 1
            fi

            echo "PASS: [$test_name] correctly rejected by verification policy (pattern matched: '$expected_pattern')."
          }

          echo ""
          echo "================================================================"
          echo " TEST A: POSITIVE VERIFICATION"
          echo "================================================================"
          echo "--> A1. Verifying via local bundle with strict repo and workflow constraints..."
          EXPECTED_SAN="https://github.com/${REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}"
          POSITIVE_BUNDLE_JSON=$(gh attestation verify "$PAYLOAD" \
            --repo "$REPO" \
            --signer-workflow "${REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}" \
            --cert-identity "$EXPECTED_SAN" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-digest "$EXPECTED_COMMIT" \
            --source-ref "$EXPECTED_REF" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --bundle "$BUNDLE" \
            --format json)
          printf '%s' "$POSITIVE_BUNDLE_JSON" > positive-verifier.json
          node scratch/verify-attestation-fixture.cjs "$PAYLOAD" "$BUNDLE" positive-verifier.json "$REPO" "$EXPECTED_WORKFLOW" "$EXPECTED_COMMIT" "$EXPECTED_REF" "$EXPECTED_SHA256"
          echo "Positive Bundle Verification Succeeded!"

          echo "--> A2. Verifying via GitHub Attestation API..."
          POSITIVE_API_JSON=""
          for attempt in 1 2 3; do
            if POSITIVE_API_JSON=$(gh attestation verify "$PAYLOAD" \
              --repo "$REPO" \
              --signer-workflow "${REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}" \
              --cert-identity "$EXPECTED_SAN" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --source-digest "$EXPECTED_COMMIT" \
              --source-ref "$EXPECTED_REF" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --format json 2> api_err.log); then
              echo "Positive API Verification Succeeded on attempt $attempt!"
              break
            fi
            echo "API verification attempt $attempt failed, retrying in 3s..."
            sleep 3
          done

          if [ -z "$POSITIVE_API_JSON" ]; then
            echo "CRITICAL DEFECT: Positive API verification failed after 3 attempts!"
            cat api_err.log
            exit 1
          fi

          echo ""
          echo "================================================================"
          echo " TEST B: TAMPER REJECTION"
          echo "================================================================"
          cp "$PAYLOAD" "${PAYLOAD}.tampered"
          echo "MALICIOUS_TAMPER_MODIFICATION_STRING" >> "${PAYLOAD}.tampered"
          echo "Tampered payload created (appended modified bytes)."

          set +e
          gh attestation verify "${PAYLOAD}.tampered" \
            --repo "$REPO" \
            --signer-workflow "${REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}" \
            --cert-identity "$EXPECTED_SAN" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-digest "$EXPECTED_COMMIT" \
            --source-ref "$EXPECTED_REF" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --bundle "$BUNDLE" > tamper_rejection.log 2>&1
          TAMPER_STATUS=$?
          set -e

          verify_expected_failure \
            "Test B: Tampered Payload" \
            "tamper_rejection.log" \
            "$TAMPER_STATUS" \
            "(no matching attestations found|no matching attestation|failed to find matching attestation|does not match bundle|attestation signature verification failed)"

          echo ""
          echo "================================================================"
          echo " TEST C: WRONG REPOSITORY REJECTION"
          echo "================================================================"
          WRONG_REPO="github/docs"
          echo "Testing verification with incorrect repository: $WRONG_REPO..."

          set +e
          WRONG_SAN="https://github.com/${WRONG_REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}"
          gh attestation verify "$PAYLOAD" \
            --repo "$WRONG_REPO" \
            --signer-workflow "${WRONG_REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}" \
            --cert-identity "$WRONG_SAN" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-digest "$EXPECTED_COMMIT" \
            --source-ref "$EXPECTED_REF" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --bundle "$BUNDLE" > wrong_repo_rejection.log 2>&1
          WRONG_REPO_STATUS=$?
          set -e

          verify_expected_failure \
            "Test C: Wrong Repository" \
            "wrong_repo_rejection.log" \
            "$WRONG_REPO_STATUS" \
            "(expected SAN value to match|no matching CertificateIdentity found|failed to verify certificate identity|expected signer repository)"

          echo ""
          echo "================================================================"
          echo " TEST D: WRONG SIGNER / WORKFLOW REJECTION"
          echo "================================================================"
          WRONG_WORKFLOW=".github/workflows/ci.yml"
          echo "--> D1. Testing verification with incorrect signer workflow: $WRONG_WORKFLOW..."

          set +e
          WRONG_WORKFLOW_SAN="https://github.com/${REPO}/${WRONG_WORKFLOW}@${EXPECTED_REF}"
          gh attestation verify "$PAYLOAD" \
            --repo "$REPO" \
            --signer-workflow "${REPO}/${WRONG_WORKFLOW}@${EXPECTED_REF}" \
            --cert-identity "$WRONG_WORKFLOW_SAN" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-digest "$EXPECTED_COMMIT" \
            --source-ref "$EXPECTED_REF" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --bundle "$BUNDLE" > wrong_workflow_rejection.log 2>&1
          WRONG_WORKFLOW_STATUS=$?
          set -e

          verify_expected_failure \
            "Test D1: Wrong Signer Workflow" \
            "wrong_workflow_rejection.log" \
            "$WRONG_WORKFLOW_STATUS" \
            "(expected SAN value to match|no matching CertificateIdentity found|failed to verify certificate identity|expected signer workflow)"

          LOOKALIKE_WORKFLOW=".github/workflows/test-attestation-fixture.yml.attacker.yml"
          echo "--> D2. Testing verification with lookalike / prefix workflow: $LOOKALIKE_WORKFLOW..."

          set +e
          LOOKALIKE_WORKFLOW_SAN="https://github.com/${REPO}/${LOOKALIKE_WORKFLOW}@${EXPECTED_REF}"
          gh attestation verify "$PAYLOAD" \
            --repo "$REPO" \
            --signer-workflow "${REPO}/${LOOKALIKE_WORKFLOW}@${EXPECTED_REF}" \
            --cert-identity "$LOOKALIKE_WORKFLOW_SAN" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-digest "$EXPECTED_COMMIT" \
            --source-ref "$EXPECTED_REF" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --bundle "$BUNDLE" > lookalike_rejection.log 2>&1
          LOOKALIKE_STATUS=$?
          set -e

          verify_expected_failure \
            "Test D2: Lookalike Signer Workflow" \
            "lookalike_rejection.log" \
            "$LOOKALIKE_STATUS" \
            "(expected SAN value to match|no matching CertificateIdentity found|failed to verify certificate identity|expected signer workflow)"

          echo ""
          echo "================================================================"
          echo " TEST E: CLAIM INSPECTION & CRYPTOGRAPHIC PROVENANCE EVIDENCE"
          echo "================================================================"
          echo "--> E1. Verifier Output Schema Check:"
          echo "$POSITIVE_BUNDLE_JSON" | jq -e '
            type == "array" and length >= 1 and
            (.[0] | has("attestation") and has("verificationResult")) and
            (.[0].verificationResult | has("statement") and has("signature") and has("verifiedTimestamps")) and
            (.[0].verificationResult.statement | has("subject") and has("predicateType") and has("predicate"))
          ' > /dev/null || { echo "CRITICAL DEFECT: Positive verification JSON schema check failed!"; exit 1; }
          echo "PASS: Verifier JSON output matches expected schema."

          echo "--> E2. in-toto Statement & DSSE Envelope Structure:"
          jq -e 'has("dsseEnvelope") and has("verificationMaterial")' "$BUNDLE" > /dev/null || {
            echo "CRITICAL DEFECT: Bundle lacks dsseEnvelope or verificationMaterial!"; exit 1;
          }
          jq -e '.dsseEnvelope | has("payloadType") and has("payload") and has("signatures")' "$BUNDLE" > /dev/null || {
            echo "CRITICAL DEFECT: DSSE envelope structure invalid!"; exit 1;
          }
          PAYLOAD_TYPE=$(jq -r '.dsseEnvelope.payloadType' "$BUNDLE")
          if [ "$PAYLOAD_TYPE" != "application/vnd.in-toto+json" ]; then
            echo "CRITICAL DEFECT: Unexpected payloadType: $PAYLOAD_TYPE"; exit 1;
          fi

          echo "--> Validating dsseEnvelope.signatures array:"
          jq -e '
            .dsseEnvelope.signatures |
            type == "array" and length >= 1 and
            (.[0] | type == "object" and has("sig") and (.sig | type == "string" and length > 0))
          ' "$BUNDLE" > /dev/null || {
            echo "CRITICAL DEFECT: dsseEnvelope.signatures is not an array containing at least one valid signature entry with non-empty sig string!";
            exit 1;
          }
          SIG_COUNT=$(jq '.dsseEnvelope.signatures | length' "$BUNDLE")
          echo "PASS: dsseEnvelope.signatures validated (count: $SIG_COUNT, first signature has valid non-empty 'sig' field)."

          STATEMENT_JSON=$(jq -r '.dsseEnvelope.payload' "$BUNDLE" | base64 -d)
          echo "$STATEMENT_JSON" | jq -e '
            (has("_type") or has("type")) and
            has("subject") and ( .subject | type == "array" and length >= 1 ) and
            has("predicateType") and has("predicate")
          ' > /dev/null || {
            echo "CRITICAL DEFECT: in-toto statement schema validation failed!"; exit 1;
          }
          echo "PASS: DSSE envelope and in-toto statement schema strictly validated."
          echo "Decoded in-toto Statement:"
          echo "$STATEMENT_JSON" | jq .

          echo "--> E3. Subject Digest Verification:"
          STATEMENT_DIGEST=$(echo "$STATEMENT_JSON" | jq -r '.subject[0].digest.sha256')
          echo "Statement subject sha256: $STATEMENT_DIGEST"
          echo "Expected payload sha256:  $EXPECTED_SHA256"
          if [ -z "$STATEMENT_DIGEST" ] || [ "$STATEMENT_DIGEST" = "null" ]; then
            echo "CRITICAL DEFECT: Statement subject sha256 is null or empty!"; exit 1;
          fi
          if [ "$STATEMENT_DIGEST" != "$EXPECTED_SHA256" ]; then
            echo "CRITICAL DEFECT: Subject digest in in-toto statement does not match payload sha256!"; exit 1;
          fi
          echo "PASS: Subject digest strictly matches independently computed SHA-256."

          echo "--> E4. Fulcio X.509 Certificate Extensions & SAN Exact Identity:"
          CERT_RAW=$(jq -r '.verificationMaterial.certificate.rawBytes // .verificationMaterial.x509CertificateChain.certificates[0].rawBytes // empty' "$BUNDLE")
          if [ -z "$CERT_RAW" ]; then
            echo "CRITICAL DEFECT: Certificate rawBytes not found in verificationMaterial! Bundle keys:"
            jq '.verificationMaterial | keys' "$BUNDLE"
            exit 1
          fi

          echo "$CERT_RAW" | base64 -d | openssl x509 -inform DER -text -noout > cert_text.txt
          echo "--- Parsed X.509 Certificate ---"
          cat cert_text.txt
          echo "--- End X.509 Certificate ---"

          # Structured extraction: Primary source is the verifier's parsed subjectAlternativeName
          # from positive verificationResult JSON.
          # Explicitly validate the type, structure, and presence of subjectAlternativeName.
          echo "$POSITIVE_BUNDLE_JSON" | jq -e '
            type == "array" and length >= 1 and
            (.[0] |
              type == "object" and
              .verificationResult != null and (.verificationResult | type == "object") and
              .verificationResult.signature != null and (.verificationResult.signature | type == "object") and
              .verificationResult.signature.certificate != null and (.verificationResult.signature.certificate | type == "object") and
              .verificationResult.signature.certificate.subjectAlternativeName != null and
              (.verificationResult.signature.certificate.subjectAlternativeName | type == "string") and
              ((.verificationResult.signature.certificate.subjectAlternativeName | length) > 0)
            )
          ' > /dev/null || {
            echo "CRITICAL DEFECT: Verifier parsed subjectAlternativeName is missing, malformed, or not a non-empty string!"
            echo "Positive bundle output was:"
            echo "$POSITIVE_BUNDLE_JSON" | jq '.[0].verificationResult.signature.certificate // empty'
            exit 1
          }

          VERIFIER_SAN=$(echo "$POSITIVE_BUNDLE_JSON" | jq -r '.[0].verificationResult.signature.certificate.subjectAlternativeName')
          if [ -z "$VERIFIER_SAN" ] || [ "$VERIFIER_SAN" = "null" ]; then
            echo "CRITICAL DEFECT: Extracted subjectAlternativeName is empty or null!"
            exit 1
          fi
          # Normalize verifier SAN URI (strip optional leading 'URI:' prefix if present)
          VERIFIER_SAN_URI="${VERIFIER_SAN#URI:}"

          # Secondary independent extraction: Query OpenSSL certificate extensions specifically for subjectAltName
          OPENSSL_SAN_EXT=$(echo "$CERT_RAW" | base64 -d | openssl x509 -inform DER -noout -ext subjectAltName 2>/dev/null || true)
          OPENSSL_SAN_URI=$(echo "$OPENSSL_SAN_EXT" | tr -d '\r\n' | sed -e 's/.*URI://' -e 's/[, ].*//')

          echo "Verifier parsed SAN URI: '$VERIFIER_SAN_URI'"
          echo "OpenSSL extracted SAN:   '$OPENSSL_SAN_URI'"

          EXPECTED_COMPLETE_IDENTITY="${REPO}/${EXPECTED_WORKFLOW}@${EXPECTED_REF}"
          EXPECTED_FULL_URI="https://github.com/${EXPECTED_COMPLETE_IDENTITY}"

          echo "Expected Complete Identity: '$EXPECTED_COMPLETE_IDENTITY'"
          echo "Expected Full URI:          '$EXPECTED_FULL_URI'"

          # Verify that Verifier SAN URI matches expected full URI exactly (no substring matching)
          if [ "$VERIFIER_SAN_URI" != "$EXPECTED_FULL_URI" ]; then
            echo "CRITICAL DEFECT: Exact verifier certificate full SAN URI mismatch!"
            echo "Expected: '$EXPECTED_FULL_URI'"
            echo "Observed: '$VERIFIER_SAN_URI'"
            exit 1
          fi

          # Extract and verify complete identity string (stripping https://github.com/)
          VERIFIER_COMPLETE_IDENTITY="${VERIFIER_SAN_URI#https://github.com/}"
          if [ "$VERIFIER_COMPLETE_IDENTITY" != "$EXPECTED_COMPLETE_IDENTITY" ]; then
            echo "CRITICAL DEFECT: Exact verifier certificate complete identity mismatch!"
            echo "Expected: '$EXPECTED_COMPLETE_IDENTITY'"
            echo "Observed: '$VERIFIER_COMPLETE_IDENTITY'"
            exit 1
          fi

          # Cross-verify with OpenSSL parsed SAN extension if present
          if [ -n "$OPENSSL_SAN_URI" ]; then
            if [ "$OPENSSL_SAN_URI" != "$EXPECTED_FULL_URI" ]; then
              echo "CRITICAL DEFECT: OpenSSL extracted SAN URI does not match expected full URI!"
              echo "Expected: '$EXPECTED_FULL_URI'"
              echo "Observed: '$OPENSSL_SAN_URI'"
              exit 1
            fi
            echo "PASS: OpenSSL extracted SAN URI strictly matches verifier and expected full URI."
          fi

          echo "PASS: Complete certificate SAN identity exactly matched: $VERIFIER_COMPLETE_IDENTITY"

          echo "--> Parsed certificate summary from verificationResult:"
          echo "$POSITIVE_BUNDLE_JSON" | jq '.[0].verificationResult.signature.certificate | { subjectAlternativeName, issuer, extensions: (.extensions // .customExtensions // empty) }'

          echo "--> E5. Rekor Transparency Log Entry Validation:"
          jq -e '
            .verificationMaterial.tlogEntries |
            type == "array" and length >= 1 and
            (.[0] |
              type == "object" and
              has("logIndex") and has("integratedTime") and has("logId") and
              # Validate logIndex is a non-negative integer (number or string representation)
              (.logIndex != null and (
                ((.logIndex | type == "number") and .logIndex >= 0 and (.logIndex == (.logIndex | floor))) or
                ((.logIndex | type == "string") and (.logIndex | test("^[0-9]+$")))
              )) and
              # Validate integratedTime is a non-negative integer timestamp (number or string representation)
              (.integratedTime != null and (
                ((.integratedTime | type == "number") and .integratedTime >= 0 and (.integratedTime == (.integratedTime | floor))) or
                ((.integratedTime | type == "string") and (.integratedTime | test("^[0-9]+$")))
              )) and
              # Validate logId against supported Sigstore schema: 64 hexadecimal characters
              (.logId != null and (
                ((.logId | type == "object") and (.logId.keyId != null) and (.logId.keyId | type == "string") and (.logId.keyId | test("^[0-9a-fA-F]{64}$"))) or
                ((.logId | type == "string") and (.logId | test("^[0-9a-fA-F]{64}$")))
              ))
            )
          ' "$BUNDLE" > /dev/null || {
            echo "CRITICAL DEFECT: verificationMaterial.tlogEntries validation failed! Rekor entries must be an array with >=1 entry containing non-negative integer logIndex, non-negative integer integratedTime, and a 64-hexadecimal character logId.";
            exit 1;
          }
          TLOG_COUNT=$(jq '.verificationMaterial.tlogEntries | length' "$BUNDLE")
          TLOG_KEY_ID=$(jq -r '.verificationMaterial.tlogEntries[0].logId.keyId // .verificationMaterial.tlogEntries[0].logId // empty' "$BUNDLE")
          TLOG_INDEX=$(jq -r '.verificationMaterial.tlogEntries[0].logIndex' "$BUNDLE")
          TLOG_TIME=$(jq -r '.verificationMaterial.tlogEntries[0].integratedTime' "$BUNDLE")
          echo "PASS: verificationMaterial.tlogEntries strictly validated:"
          echo "  - Entry count:    $TLOG_COUNT"
          echo "  - Log index:      $TLOG_INDEX"
          echo "  - IntegratedTime: $TLOG_TIME"
          echo "  - Log ID:         $TLOG_KEY_ID"
          jq '.verificationMaterial.tlogEntries[] | { logIndex, logId, integratedTime }' "$BUNDLE"

          echo ""
          echo "================================================================"
          echo " ALL NON-PRODUCTION ATTESTATION CHECKS (A, B, C, D, E) PASSED"
          echo "================================================================"
