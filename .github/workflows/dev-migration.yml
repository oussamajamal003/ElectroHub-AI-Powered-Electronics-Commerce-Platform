name: Dev Database Migration

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/dev-migration.yml'
      - 'apps/backend/prisma/schema.prisma'
      - 'apps/backend/prisma/migrations/**'

concurrency:
  group: migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Deploy Prisma Migration to Dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify Prisma Version
        run: npm exec --workspace=@electrohub/backend -- prisma --version
        
      - name: Safe Diagnostics
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}
        run: |
          cat << 'EOF' > check.js
          const checkUrl = (name, val) => {
            console.log(`--- Checking ${name} ---`);
            if (!val) { console.log(`Result: EMPTY or NOT SET`); return; }
            console.log(`Length: ${val.length}`);
            console.log(`Starts with quote? ${val.startsWith("\"") || val.startsWith("'")}`);
            console.log(`Ends with quote? ${val.endsWith("\"") || val.endsWith("'")}`);
            console.log(`Contains whitespace? ${/\s/.test(val)}`);
            console.log(`Starts with postgresql:// or postgres:// ? ${val.startsWith("postgresql://") || val.startsWith("postgres://")}`);
            console.log(`Contains DATABASE_URL= prefix? ${val.includes("DATABASE_URL=")}`);
            try {
              const u = new URL(val);
              console.log(`URL parse: SUCCESS`);
              console.log(`Protocol: ${u.protocol}`);
              console.log(`Hostname: ${u.hostname}`);
              console.log(`Has Username? ${!!u.username}`);
              console.log(`Has Password? ${!!u.password}`);
            } catch (e) {
              console.log(`URL parse: FAILED (${e.message})`);
            }
          };
          checkUrl("DATABASE_URL", process.env.DATABASE_URL);
          checkUrl("DIRECT_URL", process.env.DIRECT_URL);
          EOF
          node check.js

      - name: Deploy Prisma Migration
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy
