name: Development CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'task/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-typecheck:
    name: Frontend / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=@electrohub/frontend

  frontend-lint:
    name: Frontend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=@electrohub/frontend

  frontend-test:
    name: Frontend / Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Frontend tests are not yet implemented in develop; this check is optional until the testing framework is merged.
      - name: Test
        run: npm run test --workspace=@electrohub/frontend --if-present

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace=@electrohub/frontend

  backend-typecheck:
    name: Backend / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Typecheck
        run: npm run typecheck --workspace=@electrohub/backend

  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=@electrohub/backend

  workflow-policy:
    name: Workflow / Migration Safety Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
      - name: Policy self-tests
        run: node --test .github/scripts/*.test.cjs
      - name: Check workflows cannot deploy migrations or use shared-database credentials
        run: node .github/scripts/check-workflow-policy.cjs

  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    # No shared-database secret is available to, or referenced by, this job. All database work targets a
    # disposable PostgreSQL started below. Migrations are deployed to shared environments only by the
    # approval-gated .github/workflows/dev-migration.yml.
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Start disposable PostgreSQL
        uses: ./.github/actions/disposable-postgres
      - name: Assert the database target is the disposable instance
        run: |
          node -e "
          const urls = [process.env.DATABASE_URL, process.env.DIRECT_URL];
          const ok = process.env.ELECTROHUB_DISPOSABLE_DATABASE === '1' && urls.every((value) => {
            try { const u = new URL(value); return ['localhost', '127.0.0.1'].includes(u.hostname) && u.port === '55432'; } catch { return false; }
          });
          if (!ok) { console.error('Refusing to continue: database target is not the disposable loopback instance.'); process.exit(1); }
          console.log('Database target: disposable loopback PostgreSQL.');
          "
      - name: Setup test environment file
        run: |
          cat << 'EOF' > apps/backend/.env.test.local
          NODE_ENV=test
          PORT=5001
          JWT_REFRESH_SECRET=test-jwt-refresh-secret
          AI_SERVICE_URL=http://localhost:8000
          STRIPE_SECRET_KEY=sk_test_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_test_placeholder
          BREVO_API_KEY=test-brevo-api-key
          EOF
          node -e "require('fs').appendFileSync('apps/backend/.env.test.local', 'JWT_SECRET=' + require('crypto').randomBytes(32).toString('base64') + '\n')"
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Validate Prisma Schema
        run: npm exec --workspace=@electrohub/backend -- prisma validate
      - name: Apply migrations to the disposable database
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy
      - name: Prisma Migrate Status (disposable database)
        run: npm exec --workspace=@electrohub/backend -- prisma migrate status
      - name: Test (unit tests and integration tests, disposable database)
        run: npm run test:ci --workspace=@electrohub/backend

  backend-build:
    name: Backend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Build
        run: npm run build --workspace=@electrohub/backend

  ai:
    name: AI Service / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements*.txt
      - name: Install dependencies (pinned runtime + test + quality tooling)
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Lint (ruff)
        working-directory: apps/ai-service
        run: python -m ruff check .
      - name: Format check (ruff)
        working-directory: apps/ai-service
        run: python -m ruff format --check .
      - name: Typecheck (mypy strict)
        working-directory: apps/ai-service
        run: python -m mypy app tests
      - name: Test
        working-directory: apps/ai-service
        run: python -m pytest
      - name: Dependency audit
        working-directory: apps/ai-service
        run: python -m pip_audit -r requirements-dev.txt

  ai-docker:
    name: AI Service / Docker
    runs-on: ubuntu-latest
    # Builds the runtime image and smoke-tests it on loopback with a throwaway key. No registry push, no secrets.
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t electrohub-ai:ci apps/ai-service
      - name: Container smoke
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          if docker run --rm -e AI_ENVIRONMENT=production electrohub-ai:ci; then
            echo "production start without a service key must fail"; exit 1
          fi
          docker run -d --name eh-ai -p 127.0.0.1:18000:8000 -e AI_ENVIRONMENT=production -e AI_SERVICE_API_KEY="$KEY" electrohub-ai:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' eh-ai)" = healthy ] && break; sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' eh-ai)" = healthy
          test "$(docker exec eh-ai id -u)" != 0
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          B=http://127.0.0.1:18000
          test "$(code $B/health)" = 200
          test "$(code $B/internal/v1/ready)" = 401
          test "$(code -H "X-ElectroHub-AI-Key: $KEY" -H 'X-ElectroHub-AI-Environment: development' $B/internal/v1/ready)" = 403
          curl -sf -H "X-ElectroHub-AI-Key: $KEY" -H 'X-ElectroHub-AI-Environment: production' $B/internal/v1/ready | grep -q '"modelReady":false'
          test "$(code $B/docs)" = 404
          docker stop -t 15 eh-ai
          test "$(docker inspect -f '{{.State.ExitCode}}' eh-ai)" = 0
          ! docker logs eh-ai 2>&1 | grep -qF -- "$KEY"

