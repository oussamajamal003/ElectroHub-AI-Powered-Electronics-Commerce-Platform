name: Development CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'task/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-typecheck:
    name: Frontend / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=@electrohub/frontend

  frontend-lint:
    name: Frontend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=@electrohub/frontend

  frontend-test:
    name: Frontend / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Frontend tests are not yet implemented in develop; this check is optional until the testing framework is merged.
      - name: Test
        run: npm run test --workspace=@electrohub/frontend --if-present

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace=@electrohub/frontend

  backend-typecheck:
    name: Backend / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Typecheck
        run: npm run typecheck --workspace=@electrohub/backend

  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=@electrohub/backend

  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Setup test environment file
        run: |
          cat << 'EOF' > apps/backend/.env.test.local
          NODE_ENV=test
          PORT=5001
          DATABASE_URL="${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}"
          DIRECT_URL="${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}"
          JWT_SECRET=test-jwt-secret
          JWT_REFRESH_SECRET=test-jwt-refresh-secret
          AI_SERVICE_URL=http://localhost:8000
          STRIPE_SECRET_KEY=sk_test_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_test_placeholder
          BREVO_API_KEY=test-brevo-api-key
          CLOUDINARY_URL=cloudinary://test-key:test-secret@test-cloud
          EOF
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}"
          DIRECT_URL: "${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}"
          DIRECT_URL: "${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}"
        run: npm exec --workspace=@electrohub/backend -- prisma validate
      - name: Prisma Migrate Deploy
        env:
          DATABASE_URL: "${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}"
          DIRECT_URL: "${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}"
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy
      - name: Prisma Migrate Status
        env:
          DATABASE_URL: "${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}"
          DIRECT_URL: "${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}"
        run: npm exec --workspace=@electrohub/backend -- prisma migrate status
      - name: Test (unit tests and integration tests)
        env:
          DATABASE_URL: "${{ secrets.ELECTROHUB_DEV_DATABASE_URL }}"
          DIRECT_URL: "${{ secrets.ELECTROHUB_DEV_DIRECT_URL }}"
        run: npm run test:ci --workspace=@electrohub/backend

  backend-build:
    name: Backend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Build
        run: npm run build --workspace=@electrohub/backend

  ai:
    name: AI Service / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: apps/ai-service
        run: python -m pytest

