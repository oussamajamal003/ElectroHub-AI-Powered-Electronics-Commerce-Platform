name: Development CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'task/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-typecheck:
    name: Frontend / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=@electrohub/frontend

  frontend-lint:
    name: Frontend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=@electrohub/frontend

  frontend-test:
    name: Frontend / Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test --workspace=@electrohub/frontend

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace=@electrohub/frontend
      - name: Production JavaScript budget
        run: node scripts/frontend-budget.mjs

  backend-typecheck:
    name: Backend / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Typecheck
        run: npm run typecheck --workspace=@electrohub/backend

  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=@electrohub/backend

  workflow-policy:
    name: Workflow / Migration Safety Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Policy self-tests
        run: node --test .github/scripts/*.test.cjs
      - name: Check workflows cannot deploy migrations or use shared-database credentials
        run: node .github/scripts/check-workflow-policy.cjs

  release-e2e:
    name: Release E2E / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Task 06.1 release-critical journeys against the real backend and a disposable PostgreSQL. The stack runs hermetically
    # (ELECTROHUB_ENV_FILES=none, NODE_ENV=test, per-run random secrets): no Stripe, Brevo, AI or shared-database credential exists here.
    # Sharded by browser engine: each job has its own runner and disposable PostgreSQL, installs one engine and runs that engine's two
    # projects (fixtures are per project, so shards never share accounts). All six projects still run on every push / pull request.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, label: Chromium, projects: '--project=chromium-desktop --project=tablet-chromium-768', quality_extra: '--project=mobile-chromium-320 --project=chromium-native-zoom' }
          - { engine: firefox, label: Firefox, projects: '--project=firefox-desktop --project=wide-firefox-1920', quality_extra: '--project=tablet-firefox-1024' }
          - { engine: webkit, label: WebKit, projects: '--project=webkit-desktop --project=mobile-webkit-390', quality_extra: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Start disposable PostgreSQL
        uses: ./.github/actions/disposable-postgres
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engine }}
      - name: Install Playwright browser and OS dependencies
        working-directory: apps/frontend
        # The browser download is skipped on a cache hit; OS packages are always installed (they are not cached).
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Release suite (${{ matrix.label }} projects)
        working-directory: apps/frontend
        run: npm run test:release -- ${{ matrix.projects }}
      - name: Build optimized frontend for quality QA
        run: npm run build --workspace=@electrohub/frontend
      - name: Accessibility, keyboard and responsive QA
        working-directory: apps/frontend
        # A separate stack prevents state or server reuse across suites. No shared credentials.
        env:
          RELEASE_E2E_API_PORT: '5212'
          RELEASE_E2E_FRONTEND_PORT: '3212'
          QUALITY_PRODUCTION: '1'
        run: npm run test:quality -- ${{ matrix.projects }} ${{ matrix.quality_extra }}
      - name: Customer notification browser QA
        working-directory: apps/frontend
        run: npx playwright test -c playwright.notifications.config.ts --project=${{ matrix.engine }}
      - name: Upload release report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-report-${{ matrix.engine }}
          path: |
            apps/frontend/playwright-report/release
            apps/frontend/test-results/release
            apps/frontend/playwright-report/quality
            apps/frontend/test-results/quality
            apps/frontend/test-results/notifications
          retention-days: 14

  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    # No shared-database secret is available to, or referenced by, this job. All database work targets a
    # disposable PostgreSQL started below. Migrations are deployed to shared environments only by the
    # approval-gated .github/workflows/dev-migration.yml.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Start disposable PostgreSQL
        uses: ./.github/actions/disposable-postgres
      - name: Assert the database target is the disposable instance
        run: |
          node -e "
          const urls = [process.env.DATABASE_URL, process.env.DIRECT_URL];
          const ok = process.env.ELECTROHUB_DISPOSABLE_DATABASE === '1' && urls.every((value) => {
            try { const u = new URL(value); return ['localhost', '127.0.0.1'].includes(u.hostname) && u.port === '55432'; } catch { return false; }
          });
          if (!ok) { console.error('Refusing to continue: database target is not the disposable loopback instance.'); process.exit(1); }
          console.log('Database target: disposable loopback PostgreSQL.');
          "
      - name: Setup test environment file
        run: |
          cat << 'EOF' > apps/backend/.env.test.local
          NODE_ENV=test
          PORT=5001
          JWT_REFRESH_SECRET=test-jwt-refresh-secret
          AI_SERVICE_URL=http://localhost:8000
          STRIPE_SECRET_KEY=sk_test_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_test_placeholder
          BREVO_API_KEY=test-brevo-api-key
          EOF
          node -e "require('fs').appendFileSync('apps/backend/.env.test.local', 'JWT_SECRET=' + require('crypto').randomBytes(32).toString('base64') + '\n')"
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Validate Prisma Schema
        run: npm exec --workspace=@electrohub/backend -- prisma validate
      - name: Apply migrations to the disposable database
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy
      - name: Prisma Migrate Status (disposable database)
        run: npm exec --workspace=@electrohub/backend -- prisma migrate status
      - name: Test (unit tests and integration tests, disposable database)
        run: npm run test:ci --workspace=@electrohub/backend
      - name: Customer notification transaction and Socket.IO integration
        working-directory: apps/backend
        env:
          DELIVERY_PG_RUN: '1'
          NODE_EXTRA_CA_CERTS: ${{ env.DB_SSL_CA_CERT_PATH }}
          COMMERCE_EMAIL_ENQUEUE_ENABLED: 'true'
          COMMERCE_EMAIL_DISPATCH_ENABLED: 'false'
          COMMERCE_EMAIL_SEND_MODE: 'disabled'
          COMMERCE_EMAIL_ORIGIN: 'http://localhost:5173'
          DELIVERY_SIMULATION_ENABLED: 'true'
          DELIVERY_ORIGIN_LAT: '33.9'
          DELIVERY_ORIGIN_LNG: '35.5'
          DELIVERY_ORIGIN_LABEL: 'ElectroHub demo hub'
          BREVO_API_KEY: ''
          STRIPE_SECRET_KEY: ''
        run: |
          # Migration CLI alone uses sslmode=disable; application guards require TLS.
          # Keep the same job-owned loopback DB and its configured, verified CA.
          export DATABASE_URL="${DATABASE_URL/sslmode=disable/sslmode=require}"
          export DIRECT_URL="$DATABASE_URL"
          npx vitest run --config vitest.delivery-pg.config.mts

  backend-build:
    name: Backend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Build
        run: npm run build --workspace=@electrohub/backend

  ai:
    name: AI Service / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements*.txt
      - name: Install dependencies (pinned runtime + test + quality tooling)
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Lint (ruff)
        working-directory: apps/ai-service
        run: python -m ruff check .
      - name: Format check (ruff)
        working-directory: apps/ai-service
        run: python -m ruff format --check .
      - name: Typecheck (mypy strict)
        working-directory: apps/ai-service
        run: python -m mypy app tests
      - name: Test
        working-directory: apps/ai-service
        run: python -m pytest
      - name: Dependency audit
        working-directory: apps/ai-service
        run: python -m pip_audit -r requirements-dev.txt

  ai-docker:
    name: AI Service / Docker
    runs-on: ubuntu-latest
    # Builds the runtime image and smoke-tests it on loopback with a throwaway key. No registry push, no secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build image
        run: docker build -t electrohub-ai:ci apps/ai-service
      - name: Container smoke
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          if docker run --rm -e AI_ENVIRONMENT=production electrohub-ai:ci; then
            echo "production start without a service key must fail"; exit 1
          fi
          docker run -d --name eh-ai -p 127.0.0.1:18000:8000 -e AI_ENVIRONMENT=production -e AI_SERVICE_API_KEY="$KEY" electrohub-ai:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' eh-ai)" = healthy ] && break; sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' eh-ai)" = healthy
          test "$(docker exec eh-ai id -u)" != 0
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          B=http://127.0.0.1:18000
          test "$(code $B/health)" = 200
          test "$(code $B/internal/v1/ready)" = 401
          test "$(code -H "X-ElectroHub-AI-Key: $KEY" -H 'X-ElectroHub-AI-Environment: development' $B/internal/v1/ready)" = 403
          curl -sf -H "X-ElectroHub-AI-Key: $KEY" -H 'X-ElectroHub-AI-Environment: production' $B/internal/v1/ready | grep -q '"modelReady":false'
          test "$(code $B/docs)" = 404
          docker stop -t 15 eh-ai
          test "$(docker inspect -f '{{.State.ExitCode}}' eh-ai)" = 0
          ! docker logs eh-ai 2>&1 | grep -qF -- "$KEY"

  application-docker:
    name: Docker / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build locked application image
        run: docker build -f apps/${{ matrix.service }}/Dockerfile -t electrohub-${{ matrix.service }}:ci .
      - name: Frontend deep-link and asset smoke
        if: matrix.service == 'frontend'
        run: |
          set -euo pipefail
          docker run -d --name frontend-smoke -p 127.0.0.1:18080:80 electrohub-frontend:ci
          trap 'docker rm -f frontend-smoke' EXIT
          for attempt in $(seq 1 20); do curl -sf http://127.0.0.1:18080/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/admin/login | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/assets/missing.js)" = 404
      - name: Backend packaged runtime smoke
        if: matrix.service == 'backend'
        run: |
          docker run --rm --entrypoint node electrohub-backend:ci -e "require('@prisma/client'); require('sharp'); require('fs').accessSync('dist/bootstrap.js'); if(process.getuid()===0)process.exit(1)"

  payment-postgres:
    name: Integration / Payment PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/disposable-postgres
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@electrohub/backend
      - name: Prove fresh disposable identity and run payment concurrency/lifecycle integration
        run: |
          export ELECTROHUB_ENV_FILES=none NODE_ENV=test
          export JWT_SECRET="$(openssl rand -hex 48)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 48)"
          export OTP_HASH_SECRET="$(openssl rand -hex 32)"
          export PAYMENT_PG_DISPOSABLE_REPORT_FILE="$RUNNER_TEMP/payment-integration.json"
          export PAYMENT_PG_DISPOSABLE_URL="${DATABASE_URL%%\?*}"
          export PAYMENT_PG_DISPOSABLE_CA_FILE="$DB_SSL_CA_CERT_PATH"
          export PAYMENT_PG_DISPOSABLE_APPROVED=true
          export PAYMENT_PG_DISPOSABLE_AUTHORIZATION='DISPOSABLE:electrohub_ci:scenarios-A-Y:fixtures+reset-run-database'
          node apps/backend/scripts/payment-pg-disposable.cjs --run --scope=scenarios-A-Y
      - name: Payment integration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: payment-postgres-report
          path: ${{ runner.temp }}/payment-integration.json
          retention-days: 14

  branding-e2e:
    name: Branding E2E / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Task 06.2 side task: browser tab branding, toasts and tooltips. Hermetic: the spec intercepts every /api request and only needs the
    # Vite dev server, so there is no database, backend, payment runtime or credential. One runner and one engine per shard.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, label: Chromium, projects: '--project=chromium --project=mobile-chromium-390 --project=mobile-chromium-320' }
          - { engine: firefox, label: Firefox, projects: '--project=firefox' }
          - { engine: webkit, label: WebKit, projects: '--project=webkit' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engine }}
      - name: Install Playwright browser and OS dependencies
        working-directory: apps/frontend
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Branding, toast and tooltip suite (${{ matrix.label }})
        working-directory: apps/frontend
        run: npm run test:branding -- ${{ matrix.projects }}
      - name: Upload branding report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: branding-e2e-report-${{ matrix.engine }}
          path: |
            apps/frontend/playwright-report/branding
            apps/frontend/test-results/branding
          retention-days: 14

  quality-gate:
    name: Required / Quality Gate
    if: ${{ always() }}
    needs: [frontend-lint, frontend-typecheck, frontend-test, frontend-build, backend-lint, backend-typecheck, backend-test, backend-build, workflow-policy, release-e2e, branding-e2e, ai, ai-docker, application-docker, payment-postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e "const jobs=JSON.parse(process.env.RESULTS);const bad=Object.entries(jobs).filter(([,job])=>job.result!=='success');for(const [name,job] of bad)console.error(name+': '+job.result);if(bad.length)process.exit(1)"

