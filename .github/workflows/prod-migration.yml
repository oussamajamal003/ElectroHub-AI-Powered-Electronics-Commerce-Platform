name: Production Database Migration

# Automated production path on develop push/merge, with optional manual workflow_dispatch.
# Automatically deploys reviewed, non-destructive Prisma migrations to the PROD database
# (project ref yepfgjehdstlxbpespun) when pushed or merged to develop.
#
# If the database is already up to date, the workflow performs a read-only verification
# and cleanly exits as a successful no-op.

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'Full 40-character SHA of the reviewed commit; defaults to current HEAD if omitted.'
        required: false
        type: string
      approved_migrations:
        description: 'Exact ordered migration list override (leave blank for reviewed production allowlist).'
        required: false
        type: string
        default: '20261024000000_ai_vector_search,20261025000000_ai_vector_staging_guard,20261028000000_product_media,20261028010000_catalog_media_overlay,20261028020000_product_media_worker_health,20261029000000_recommendations'

permissions:
  contents: read

jobs:
  migrate:
    name: Deploy approved Prisma migrations to PROD
    runs-on: ubuntu-latest
    environment: electrohub-prod-database
    concurrency:
      group: db-migration-electrohub-prod
      cancel-in-progress: false
    env:
      MIGRATION_TARGET: PROD
      EXPECTED_PROJECT_REF: yepfgjehdstlxbpespun
      APPROVED_COMMIT: ${{ inputs.approved_commit || github.sha }}
      APPROVED_MIGRATIONS: ${{ inputs.approved_migrations || '20261024000000_ai_vector_search,20261025000000_ai_vector_staging_guard,20261028000000_product_media,20261028010000_catalog_media_overlay,20261028020000_product_media_worker_health,20261029000000_recommendations' }}
    steps:
      - name: Verify triggering event, commit SHA, and approved migration allowlist
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering event: ${{ github.event_name }} on ref: ${{ github.ref }}"
          if ! printf '%s' "$APPROVED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "approved_commit must be a full 40-character lowercase SHA." >&2
            exit 1
          fi
          if [ "$APPROVED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "This run is at a different commit than the approved one. Refusing." >&2
            exit 1
          fi
          expected='20261024000000_ai_vector_search,20261025000000_ai_vector_staging_guard,20261028000000_product_media,20261028010000_catalog_media_overlay,20261028020000_product_media_worker_health,20261029000000_recommendations'
          if [ "$APPROVED_MIGRATIONS" != "$expected" ]; then
            echo "The approved PROD migration list or order is not exact. Refusing." >&2
            exit 1
          fi
          echo "Target commit: $APPROVED_COMMIT verified. Production allowlist: $APPROVED_MIGRATIONS verified."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma version
        run: npm exec --workspace=@electrohub/backend -- prisma --version

      - name: Pre-check (read-only) - target, checksums, ledger, and exact approved pending set
        id: pre
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: node .github/scripts/migration-plan.cjs pre

      - name: Deploy approved Prisma migrations
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy

      - name: Verify Prisma migration status
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate status

      - name: Post-check (read-only) - nothing pending and approved entries finished
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: node .github/scripts/migration-plan.cjs post
