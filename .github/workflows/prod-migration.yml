name: Production Database Migration

# Production writes require an independently approved manual dispatch at the reviewed SHA.
# Ordinary develop merges validate code but do not authorize production migrations (Task 06.2).
#
# If the database is already up to date, the workflow performs a read-only verification
# and cleanly exits as a successful no-op.

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'Full 40-character SHA of the independently reviewed and authorized production release.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Deploy pending Prisma migrations to PROD
    runs-on: ubuntu-latest
    environment: electrohub-prod-database
    concurrency:
      group: db-migration-electrohub-prod
      cancel-in-progress: false
    env:
      MIGRATION_TARGET: PROD
      EXPECTED_PROJECT_REF: yepfgjehdstlxbpespun
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
    steps:
      - name: Verify triggering event and commit SHA
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/develop ]; then
            echo "Production migrations require a reviewed develop commit." >&2
            exit 1
          fi
          echo "Triggering event: ${{ github.event_name }} on ref: ${{ github.ref }}"
          if ! printf '%s' "$APPROVED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "approved_commit must be a full 40-character lowercase SHA." >&2
            exit 1
          fi
          if [ "$APPROVED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "This run is at a different commit than the approved one. Refusing." >&2
            exit 1
          fi
          echo "Target commit: $APPROVED_COMMIT verified. Pending migrations will be discovered from the checked-in Prisma migrations and PROD ledger."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma version
        run: npm exec --workspace=@electrohub/backend -- prisma --version

      - name: Pre-check (read-only) - target, checksums, ledger, and all pending migrations
        id: pre
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: node .github/scripts/migration-plan.cjs pre

      - name: Deploy all safe pending Prisma migrations
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy

      - name: Verify Prisma migration status
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate status

      - name: Post-check (read-only) - nothing pending and applied history intact
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: node .github/scripts/migration-plan.cjs post
