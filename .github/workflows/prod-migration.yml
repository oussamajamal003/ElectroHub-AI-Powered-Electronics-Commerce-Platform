name: Production Database Migration

# Manual exact-SHA operation. A successful CI run never starts a PROD mutation by itself.
# The protected PROD environment, target/checksum/order validation, and additive-only SQL gate remain required.
#
# If the database is already up to date, the workflow performs a read-only verification
# and cleanly exits as a successful no-op.

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'Full 40-character SHA of the approved develop commit. Must equal this workflow run SHA.'
        required: true
        type: string
      authorization_reference:
        description: 'Reference to the written owner/DBA approval for this production migration.'
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  migrate:
    name: Deploy pending Prisma migrations to PROD
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: electrohub-prod-database
    concurrency:
      group: db-migration-electrohub-prod
      cancel-in-progress: false
    env:
      MIGRATION_TARGET: PROD
      EXPECTED_PROJECT_REF: yepfgjehdstlxbpespun
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
    steps:
      - name: Verify exact develop SHA and recorded authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/develop ]; then
            echo "Production migrations can only be dispatched at a commit on develop." >&2
            exit 1
          fi
          if ! printf '%s' "$APPROVED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "approved_commit must be a full 40-character lowercase SHA." >&2
            exit 1
          fi
          if [ "$APPROVED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "The approved SHA must exactly match this workflow run's checked-out develop commit." >&2
            exit 1
          fi
          if [ -z "${AUTHORIZATION_REFERENCE//[[:space:]]/}" ]; then
            echo "authorization_reference is required." >&2
            exit 1
          fi
          echo "Exact develop SHA and authorization reference confirmed. Pending migrations will be discovered from the checked-in Prisma migrations and PROD ledger."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.approved_commit }}

      - name: Require exact-SHA quality and security checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        with:
          script: |
            const sha = process.env.APPROVED_COMMIT;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });
            const required = ['Required / Quality Gate', 'Security / NPM Audit'];
            for (const name of required) {
              const runs = data.check_runs
                .filter((run) => run.name === name && run.head_sha === sha)
                .sort((a, b) => Date.parse(b.completed_at ?? b.started_at ?? '') - Date.parse(a.completed_at ?? a.started_at ?? ''));
              const latest = runs[0];
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                core.setFailed(`Required check did not succeed for approved SHA: ${name}`);
              }
            }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma version
        run: npm exec --workspace=@electrohub/backend -- prisma --version

      - name: Pre-check (read-only) - target, checksums, ledger, and all pending migrations
        id: pre
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: node .github/scripts/migration-plan.cjs pre

      - name: Deploy all safe pending Prisma migrations
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate deploy

      - name: Verify Prisma migration status
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: npm exec --workspace=@electrohub/backend -- prisma migrate status

      - name: Post-check (read-only) - nothing pending and applied history intact
        if: steps.pre.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.ELECTROHUB_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.ELECTROHUB_PROD_DIRECT_URL }}
        run: node .github/scripts/migration-plan.cjs post
