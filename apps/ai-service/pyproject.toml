# Tool configuration only; dependencies are pinned in requirements*.txt.
[project]
name = "electrohub-ai-service"
version = "0.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is how pytest asserts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fixture credentials are deliberately fake

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^venv/", "^[.]venv/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
