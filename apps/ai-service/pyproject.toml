# Tool configuration only; dependencies are pinned in requirements*.txt.
[project]
name = "electrohub-ai-service"
version = "0.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is how pytest asserts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fixture credentials are deliberately fake

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^venv/", "^[.]venv/"]

[[tool.mypy.overrides]]
# torchvision ships no type information; only the efficientnet_b0 constructor is used.
module = ["torchvision", "torchvision.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pyrefly]
# Training modules import embedding_network flat (Kaggle bundles them side by side); mirror training/tests/conftest.py.
search-path = [".", "training/src", "app/models"]
python-interpreter-path = "venv/Scripts/python.exe"
project-excludes = ["venv/**", "training/.data/**"]
